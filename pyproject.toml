[project]
name = "disease-detect"
version = "0.1.0"
description = "Utilities for configuring access to Google Generative AI for DiseaseDetect"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
